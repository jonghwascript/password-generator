<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stack Sample</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <!-- 기본 사용 (모든 요소가 1.5rem 간격으로 예쁘게 떨어짐) -->
  <div class="stack" style="--space: 3rem">
    <h2>회원가입</h2>
    <p>환영합니다! 정보를 입력해 주세요.</p>
    <input type="text" placeholder="이메일" />
    <input type="password" placeholder="비밀번호" />
  </div>

  <hr class="stack">

  <!-- 간격 변경 (CSS를 새로 짤 필요 없이 속성만 추가) -->
  <!-- 입력 폼 내부처럼 촘촘해야 하는 곳 -->
  <div class="stack" data-space="small">
    <label>이름</label>
    <input type="text">
  </div>


  <hr class="stack">

  <!-- 카드의 전체 높이를 100%로 잡았다고 가정 -->
  <div class="stack" style="height: 100%;">
    <h3>프리미엄 요금제</h3>
    <p>모든 기능을 무제한으로...</p>

    <!-- 앞의 요소들과 여백을 최대치로 벌려서 자신을 맨 아래로 박아버림 -->
    <button class="push-bottom">결제하기</button>
  </div>

</body>

</html>
