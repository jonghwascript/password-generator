<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Every Layout</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <div class="stack-divided">
    <!-- Box(테두리/패딩)와 Stack(내부 세로 간격)을 결합! -->
    <div class="box stack" style="--border-thin: 20px">
      <h3>프리미엄 요금제</h3>
      <p>모든 기능을 제한 없이 사용해 보세요.</p>
      <button>가입하기</button>
    </div>

    <div class="box stack" data-invert="true" data-padding="large">
      <h2>⚠️ 주의사항</h2>
      <p>이 작업은 되돌릴 수 없습니다. 계속하시겠습니까?</p>
      <button>네, 삭제합니다</button>
    </div>
  </div>
</body>

</html>
