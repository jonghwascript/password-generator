<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./css/style.css" />

    <title>Frontend Mentor | Password generator app</title>
  </head>

  <body>
    <!-- Centered on the screen : Cover + Center -->
    <main id="main" class="password-page l-cover">
      <section class="password-generator l-stack l-center" data-space="normal">
        <h1 class="title">Password Generator</h1>
        <div
          class="output-password l-box"
          data-border="none"
          data-radius="none"
          data-padding="normal"
        >
          <div class="l-cluster" data-justify="between">
            <!-- The `<output>` element is suitable for generated passwords or password strength calculation results. Provide a label to indicate its purpose. -->
            <output class="password">P4$5W0rD!</output>
            <div class="l-cluster">
              <span class="copied">COPIED</span>
              <p id="copy-status" class="u-sr-only" role="status"></p>
              <button
                type="button"
                class="password-copy"
                aria-label="Copy password"
              >
                <svg
                  class="copy-svg"
                  viewBox="0 0 21 24"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M20.341 3.091 17.909.659A2.25 2.25 0 0 0 16.319 0H8.25A2.25 2.25 0 0 0 6 2.25V4.5H2.25A2.25 2.25 0 0 0 0 6.75v15A2.25 2.25 0 0 0 2.25 24h10.5A2.25 2.25 0 0 0 15 21.75V19.5h3.75A2.25 2.25 0 0 0 21 17.25V4.682a2.25 2.25 0 0 0-.659-1.591ZM12.469 21.75H2.53a.281.281 0 0 1-.281-.281V7.03a.281.281 0 0 1 .281-.281H6v10.5a2.25 2.25 0 0 0 2.25 2.25h4.5v1.969a.282.282 0 0 1-.281.281Zm6-4.5H8.53a.281.281 0 0 1-.281-.281V2.53a.281.281 0 0 1 .281-.281H13.5v4.125c0 .621.504 1.125 1.125 1.125h4.125v9.469a.282.282 0 0 1-.281.281Zm.281-12h-3v-3h.451c.075 0 .147.03.2.082L18.667 4.6a.283.283 0 0 1 .082.199v.451Z"
                    fill="#A4FFAF"
                  />
                </svg>
              </button>
            </div>
          </div>
        </div>
        <!-- Group the configuration and creation actions within a `<form>`, and use `<fieldset>` and `<legend>` to describe the related checkboxes. -->
        <form
          class="l-stack l-box form-password"
          data-border="none"
          data-radius="none"
          data-padding="normal"
        >
          <!-- Character Length -->
          <div class="length">
            <div class="l-stack">
              <div class="l-cluster" data-justify="between">
                <label for="length">Character Length</label>
                <output id="length-val">0</output>
              </div>
              <input
                type="range"
                min="1"
                max="20"
                step="1"
                value="10"
                id="length"
              />
            </div>
          </div>
          <!-- Character types -->
          <fieldset class="special-letters l-stack" data-space="normal">
            <!-- The legend is visually hidden but still announced by screen readers as the group name. -->
            <legend class="u-sr-only">Character types</legend>
            <label class="l-cluster" data-justify="start" data-gap="normal">
              <input type="checkbox" class="u-sr-only" name="uppercase" />
              <span class="checkbox-mark" aria-hidden="true"></span>
              <span class="desc">Include Uppercase Letters</span>
            </label>
            <label class="l-cluster" data-justify="start" data-gap="normal">
              <input
                type="checkbox"
                class="u-sr-only"
                name="lowercase"
                checked
              />
              <span class="checkbox-mark" aria-hidden="true"></span>
              <span class="desc">Include Lowercase Letters</span>
            </label>
            <label class="l-cluster" data-justify="start" data-gap="normal">
              <input type="checkbox" class="u-sr-only" name="numbers" />
              <span class="checkbox-mark" aria-hidden="true"></span>
              <span class="desc">Include Numbers</span>
            </label>
            <label class="l-cluster" data-justify="start" data-gap="normal">
              <input type="checkbox" class="u-sr-only" name="symbols" />
              <span class="checkbox-mark" aria-hidden="true"></span>
              <span class="desc">Include Symbols</span>
            </label>
          </fieldset>
          <!-- Strength + Generate: 둘 사이 간격(16 / 32)이 폼 섹션 간격(32)과 달라서 따로 묶는다 -->
          <div class="strength-actions l-stack">
            <!-- Strength -->
            <div
              class="strength l-cluster l-box"
              data-justify="between"
              data-border="none"
              data-radius="none"
              data-padding="normal"
            >
              <span id="strength-label">Strength</span>
              <div class="l-cluster" data-gap="normal">
                <output
                  class="strength-value"
                  aria-labelledby="strength-label"
                ></output>
                <div class="l-cluster" aria-hidden="true" data-gap="small">
                  <span class="box-strength one"></span>
                  <span class="box-strength two"></span>
                  <span class="box-strength three"></span>
                  <span class="box-strength four"></span>
                </div>
              </div>
            </div>
            <!-- Generate -->
            <button
              type="submit"
              class="generate-btn l-cluster"
              data-gap="normal"
            >
              <span class="btn-name">generate</span>
              <svg
                viewBox="0 0 12 12"
                xmlns="http://www.w3.org/2000/svg"
                class="btn-arrow"
                aria-hidden="true"
              >
                <path
                  fill="#24232C"
                  d="m5.106 12 6-6-6-6-1.265 1.265 3.841 3.84H.001v1.79h7.681l-3.841 3.84z"
                />
              </svg>
            </button>
          </div>
        </form>
      </section>
    </main>
    <script src="./js/lib/jquery-4.0.0.min.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
