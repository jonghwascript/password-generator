<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./css/style.css" />

    <title>Frontend Mentor | Password generator app</title>
  </head>

  <body>
    <!-- Centered on the screen : Cover + Center -->
    <main id="main" class="c-page l-cover">
      <section
        class="c-generator l-stack l-center"
        aria-labelledby="generator-title"
      >
        <h1 id="generator-title" class="c-generator__title">
          Password Generator
        </h1>
        <div class="c-output l-box" data-border="none" data-radius="none">
          <div class="l-cluster" data-justify="between">
            <!-- The `<output>` element is suitable for generated passwords or password strength calculation results. Provide a label to indicate its purpose. -->
            <output id="password" class="c-output__password">P4$5W0rD!</output>
            <div class="l-cluster">
              <span id="copied" class="c-output__copied">COPIED</span>
              <p id="copy-status" class="u-sr-only" role="status"></p>
              <button
                id="copy-button"
                type="button"
                class="c-output__copy"
                aria-label="Copy password"
              >
                <svg
                  class="c-output__copy-icon"
                  viewBox="0 0 21 24"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M20.341 3.091 17.909.659A2.25 2.25 0 0 0 16.319 0H8.25A2.25 2.25 0 0 0 6 2.25V4.5H2.25A2.25 2.25 0 0 0 0 6.75v15A2.25 2.25 0 0 0 2.25 24h10.5A2.25 2.25 0 0 0 15 21.75V19.5h3.75A2.25 2.25 0 0 0 21 17.25V4.682a2.25 2.25 0 0 0-.659-1.591ZM12.469 21.75H2.53a.281.281 0 0 1-.281-.281V7.03a.281.281 0 0 1 .281-.281H6v10.5a2.25 2.25 0 0 0 2.25 2.25h4.5v1.969a.282.282 0 0 1-.281.281Zm6-4.5H8.53a.281.281 0 0 1-.281-.281V2.53a.281.281 0 0 1 .281-.281H13.5v4.125c0 .621.504 1.125 1.125 1.125h4.125v9.469a.282.282 0 0 1-.281.281Zm.281-12h-3v-3h.451c.075 0 .147.03.2.082L18.667 4.6a.283.283 0 0 1 .082.199v.451Z"
                    fill="#A4FFAF"
                  />
                </svg>
              </button>
            </div>
          </div>
          <p id="copy-error" class="c-output__error" role="alert" hidden></p>
        </div>
        <!-- Group the configuration and creation actions within a `<form>`, and use `<fieldset>` and `<legend>` to describe the related checkboxes. -->
        <form
          id="password-form"
          class="c-options l-stack l-box"
          data-border="none"
          data-radius="none"
        >
          <!-- Character Length -->
          <div class="c-length l-stack">
            <div class="l-cluster" data-justify="between">
              <label class="c-length__label" for="length"
                >Character Length</label
              >
              <output id="length-val" class="c-length__value">0</output>
            </div>
            <input
              id="length"
              class="c-slider"
              type="range"
              min="1"
              max="20"
              step="1"
              value="10"
            />
          </div>
          <!-- Character types -->
          <fieldset
            id="character-types"
            class="c-options__types l-stack"
            data-space="normal"
          >
            <!-- The legend is visually hidden but still announced by screen readers as the group name. -->
            <legend class="u-sr-only">Character types</legend>
            <label class="c-checkbox l-cluster" data-justify="start">
              <input
                type="checkbox"
                class="c-checkbox__input u-sr-only"
                name="uppercase"
              />
              <span class="c-checkbox__mark" aria-hidden="true"></span>
              <span class="c-checkbox__label">Include Uppercase Letters</span>
            </label>
            <label class="c-checkbox l-cluster" data-justify="start">
              <input
                type="checkbox"
                class="c-checkbox__input u-sr-only"
                name="lowercase"
                checked
              />
              <span class="c-checkbox__mark" aria-hidden="true"></span>
              <span class="c-checkbox__label">Include Lowercase Letters</span>
            </label>
            <label class="c-checkbox l-cluster" data-justify="start">
              <input
                type="checkbox"
                class="c-checkbox__input u-sr-only"
                name="numbers"
              />
              <span class="c-checkbox__mark" aria-hidden="true"></span>
              <span class="c-checkbox__label">Include Numbers</span>
            </label>
            <label class="c-checkbox l-cluster" data-justify="start">
              <input
                type="checkbox"
                class="c-checkbox__input u-sr-only"
                name="symbols"
              />
              <span class="c-checkbox__mark" aria-hidden="true"></span>
              <span class="c-checkbox__label">Include Symbols</span>
            </label>
            <!-- Validation message. Hidden until a submit fails; linked to the related control with aria-describedby. -->
            <p
              id="options-error"
              class="c-options__error"
              role="alert"
              hidden
            ></p>
          </fieldset>
          <!-- Strength + Generate: 둘 사이 간격(16 / 32)이 폼 섹션 간격(32)과 달라서 따로 묶는다 -->
          <div class="c-options__actions l-stack">
            <!-- Strength -->
            <div
              id="strength"
              class="c-strength l-cluster l-box"
              data-justify="between"
              data-border="none"
              data-radius="none"
            >
              <span id="strength-label" class="c-strength__label"
                >Strength</span
              >
              <div class="l-cluster" data-gap="normal">
                <output
                  id="strength-value"
                  class="c-strength__value"
                  aria-labelledby="strength-label"
                ></output>
                <div
                  id="strength-bars"
                  class="l-cluster"
                  aria-hidden="true"
                  data-gap="small"
                >
                  <span class="c-strength__bar"></span>
                  <span class="c-strength__bar"></span>
                  <span class="c-strength__bar"></span>
                  <span class="c-strength__bar"></span>
                </div>
              </div>
            </div>
            <!-- Generate -->
            <button type="submit" class="c-button l-cluster">
              <span class="c-button__label">generate</span>
              <svg
                viewBox="0 0 12 12"
                xmlns="http://www.w3.org/2000/svg"
                class="c-button__icon"
                aria-hidden="true"
              >
                <path
                  fill="#24232C"
                  d="m5.106 12 6-6-6-6-1.265 1.265 3.841 3.84H.001v1.79h7.681l-3.841 3.84z"
                />
              </svg>
            </button>
          </div>
        </form>
      </section>
    </main>
    <script src="./js/lib/jquery-4.0.0.min.js"></script>
    <script src="./js/password.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
